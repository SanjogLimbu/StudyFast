name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx vitest run

  pytest:
    runs-on: ubuntu-latest

    # The app reads these at import. No test connects to anything, so placeholders are enough.
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      RESEND_API_KEY: test
      OPENAI_API_KEY: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: fastapi/api/requirements.txt

      - run: pip install -r fastapi/api/requirements.txt pytest
      - run: python -m pytest
